name: Java Web Servlet CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Lấy mã nguồn từ repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Cấu hình môi trường Java (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Biên dịch và đóng gói file .war
    - name: Build with Maven
      run: mvn clean package

    # 4. Lưu lại file .war sau khi build thành công
    - name: Upload WAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-servlet-war
        path: target/*.war